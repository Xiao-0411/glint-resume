server {
    listen 80;
    server_name sgjl.cloud www.sgjl.cloud;

    return 301 https://sgjl.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.sgjl.cloud;

    ssl_certificate /etc/letsencrypt/live/sgjl.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgjl.cloud/privkey.pem;

    return 301 https://sgjl.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sgjl.cloud;

    ssl_certificate /etc/letsencrypt/live/sgjl.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgjl.cloud/privkey.pem;

    root /var/www/sgjl.cloud/dist;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
